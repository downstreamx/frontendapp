name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: https://staging-api.downstreamx.com/api/v1
          VITE_APP_NAME: downstreamx
        run: npm run build

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    if: ${{ false }}
    # Set if: always() (or delete this `if`) once the repo has `npm run test:e2e:ci` and Playwright.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build SPA for preview server
        env:
          VITE_API_BASE_URL: https://staging-api.downstreamx.com/api/v1
          VITE_APP_NAME: downstreamx
        run: npm run build

      - name: Run E2E smoke
        run: npm run test:e2e:ci
        env:
          CI: true
